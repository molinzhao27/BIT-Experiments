# Diagnostic sentence contrasts (DESIGN.md §5; docs/PROBES_FOILS.md): the curated tables behind the text-side foils.
# scripts/build_foils.py applies them deterministically (seeded per trial) to BIT-val / BIT-test sentences and writes
# data/processed/foils/<sha12>/foils.csv for review; this file's content hash goes into that manifest. Edit here, never
# in the CSV. All lowercase, BIT's normalization (apostrophes kept, no other punctuation).
seed: 0
splits: [val, test]

# Function words: never the word a paraphrase or sound-alike foil replaces.
stopwords: [a, an, the, and, or, but, if, so, of, to, in, "on", at, by, for, from, with, as, into, onto, about, than,
  then, that, this, these, those, there, here, it, its, it's, i, me, my, you, your, he, him, his, she, her, we, us,
  our, they, them, their, is, am, are, was, were, be, been, being, do, does, did, have, has, had, will, would, can,
  could, shall, should, may, might, must, not, "no", "yes", what, who, whom, which, when, where, why, how, all, some,
  any, each, every, both, either, neither, just, very, too, also, up, out, "off", over, under, oh, well, uh, um]

