    milwaukee, nashville, orlando, philadelphia, phoenix, pittsburgh, portland, seattle, london, paris, tokyo, berlin,
    rome, moscow, madrid, toronto]
  country: [america, canada, mexico, china, japan, india, russia, france, germany, italy, spain, england, ireland,
    brazil, iran, iraq, israel, egypt, kenya, korea, vietnam, australia, sweden, norway, poland, greece, cuba]
  first_name: [john, mary, james, robert, michael, david, william, richard, joseph, thomas, charles, daniel, matthew,
