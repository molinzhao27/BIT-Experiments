# paraphrase / contraction: written in one direction; both directions are applied ("did not" <-> "didn't").
# 's / 're / 've / 'll forms after a pronoun; "it's been" expands to "it has been" (has_before).
contractions:
  "do not": "don't"
  "does not": "doesn't"
  "did not": "didn't"
  "is not": "isn't"
  "are not": "aren't"
  "was not": "wasn't"
  "were not": "weren't"
  "have not": "haven't"
  "has not": "hasn't"
  "had not": "hadn't"
  "will not": "won't"
  "would not": "wouldn't"
  "could not": "couldn't"
  "should not": "shouldn't"
  "cannot": "can't"
  "i am": "i'm"
  "you are": "you're"
  "we are": "we're"
  "they are": "they're"
  "i have": "i've"
  "you have": "you've"
  "we have": "we've"
  "they have": "they've"
  "i will": "i'll"
  "you will": "you'll"
  "we will": "we'll"
  "they will": "they'll"
  "he will": "he'll"
  "she will": "she'll"
  "it will": "it'll"
  "let us": "let's"
  "it is": "it's"
  "that is": "that's"
  "there is": "there's"
  "what is": "what's"
  "he is": "he's"
  "she is": "she's"
has_before: [been, got, gotten, had]   # "it's been" -> "it has been", not "it is been"
# "<pronoun> have" contracts only before a participle ("i've got", not "you've really strong views"); "<pronoun>
# will / have" never contracts before "not" ("won't", "haven't" instead of "they'll not").
contract_have_before: [been, got, gotten, had, done, seen, never, gone, made, heard, taken, given, found, lost, known,
  told, always, already, just]

# negation: remove the sentence's first negation, else insert "not" after its first copula / modal.
negation_remove:
  not: ""
  "don't": do
  "doesn't": does
  "didn't": did
  "isn't": is
  "aren't": are
  "wasn't": was
  "weren't": were
  "haven't": have
  "hasn't": has
  "hadn't": had
  "won't": will
  "wouldn't": would
  "couldn't": could
  "shouldn't": should
  "can't": can
  cannot: can
negation_insert_after: [am, is, are, was, were, will, would, can, could, should, must, might, shall, "i'm",
  "it's", "that's", "they're", "we're", "you're", "he's", "she's", "there's"]

# number / name: a number word, or a name of the same category, replaced by another of the same category, preferably
# with as many syllables. Left out: "one" (mostly a pronoun: "a gold one"); "may", "march", "august" (verbs,
# adjectives); first names that are common words (rose, mark, bill, grace, frank).
numbers:
  unit: [zero, two, three, four, five, six, seven, eight, nine]
  teen: [ten, eleven, twelve, thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen]
  tens: [twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety]
  magnitude: [hundred, thousand, million, billion]
  ordinal: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth, tenth, eleventh, twelfth]
number_compound: true         # a number word next to another number word ("two thousand", "eighty seven") is left alone
ordinal_after: [the, a, my, his, her, our, their, your, its, this, that]   # "the first year", not "do first"
name_not_after: [new, san, los, las, saint]   # "new england" is not "new japan"
names:
  day: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]
  month: [january, february, april, june, july, september, october, november, december]
  state: [alabama, alaska, arizona, arkansas, california, colorado, connecticut, delaware, florida, georgia, hawaii,
    idaho, illinois, indiana, iowa, kansas, kentucky, louisiana, maine, maryland, massachusetts, michigan, minnesota,
