    jennifer, patricia, sarah, karen, nancy, lisa, betty, helen, sandra, donna, carol, ruth, sharon, michelle, laura,
    emily, anna, kate, jane, alice, tom, bob, jim, joe, mike, dave, steve, sam, ben, tim, dan, fred,
    henry, harry, larry, gary, eric, adam, alex, amy, ann, emma, ellen, julie, wayne, jose]

# Words a sound-alike foil never writes (the CMU dictionary is broad).
blocklist: [ass, damn, hell, crap, piss, shit, fuck, bitch, dick, cock, slut, whore, nigger, fag, rape, nazi, sex,
  sexy, porn, kill, gay]
sound_alike_min_zipf: 3.0    # neighbour must be a reasonably common word (wordfreq Zipf, en)
