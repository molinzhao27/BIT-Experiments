# Phase 2: perception -> intent transfer (train on one behavior, test on another).
# Preprocessing, window grids and Fig 1E behavior/array names come from Phase 1's config.
phase1_config: configs/phase1.yaml
seed: 42
n_permutations: 1000
perm_chunk: 250            # permutation rows evaluated per batch (GPU memory)
inner_folds: 10            # window selection on the training behavior only
device: auto               # cuda if available, else cpu
alpha: 0.05                # permutation p, Benjamini-Hochberg within each (dataset, normalization) family

# Arrays significant for >= 1 behavior in Phase 1 (T16-PEF and T16-6d were not).
# priority = i6v / 55b arrays, shown in the main figures.
arrays:
  - [T12, i6v, T12-i6v, true]
  - [T15, i6v, T15-i6v, true]
  - [T16, i6v, T16-i6v, true]
  - [T15, 55b, T15-55b, true]
  - [T17, 55b, T17-55b, true]
  - [T15, M1, T15-4, false]
  - [T17, s6v-v, T17-s6v-A, false]
  - [T17, s6v-d, T17-s6v-B, false]
  - [T12, s6v, T12-s6v, false]
  - [T15, s6v, T15-s6v, false]

# block:  the paper's normalization — each block centered on its own mean, each file z-scored
#         (uses unlabeled test-behavior data, since each isolated block holds one behavior)
# strict: center and scale with training-behavior statistics only; test data never used
norm_modes: [block, strict]

inner_speech: [imagined1stMotor, imagined1stAuditory, imaginedListening]

# Key directions for the summary table: [train, test]
key_pairs:
  - [listening, imagined1stMotor]
  - [listening, imagined1stAuditory]
  - [listening, imaginedListening]
  - [reading, imagined1stMotor]
  - [reading, imagined1stAuditory]
  - [reading, imaginedListening]
  - [imagined1stMotor, listening]
  - [imagined1stAuditory, listening]
  - [imaginedListening, listening]
  - [imagined1stMotor, reading]
  - [imagined1stAuditory, reading]
  - [imaginedListening, reading]
  - [attempted, imagined1stMotor]
  - [attempted, imagined1stAuditory]
  - [attempted, imaginedListening]

# Diagnostic train-time x test-time maps (never used for any selection)
tgm:
  arrays: [T12-i6v, T15-i6v, T16-i6v, T15-55b]
  train: [listening, reading, attempted]
  test: [imagined1stMotor, imagined1stAuditory, imaginedListening]

# Interleaved sessions: behaviors mixed within blocks (the drift control). Audio for
# listening plays in the delay epoch for T12, at go for T15/T16/T17 (docs/DATA_NOTES.md §5).
interleaved:
  task: interleavedVerbalBehaviors
  sessions:
    T12: {delay_s: 1.8, go_s: 3.0, listening_event: delay}
    T15: {delay_s: 1.5, go_s: 3.0, listening_event: go}
    T16: {delay_s: 2.0, go_s: 2.0, listening_event: go}
    T17: {delay_s: 1.5, go_s: 3.0, listening_event: go}
