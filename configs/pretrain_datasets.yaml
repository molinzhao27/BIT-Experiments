    hours. README marks 33 sentences excluded from analysis.
  - 'Use raw Datasets/*/{sentences,singleLetters,straightLines}.mat; neuralActivityCube is a convenience view
    of neuralActivityTimeSeries, not extra recordings. Sentence cubes must be cropped with numTimeBinsPerSentence:
    trailing entries can include following sentences.'
  - RNNTrainingSteps includes time-warped/processed duplicates and model artifacts; BigramLM and mouseTemplates.mat
    are not neural pretraining data.
