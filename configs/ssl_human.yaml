# Phase 4b: BIT-style masked-modeling SSL pretraining on human intracortical SPEECH data
# (Zhang et al., arXiv:2511.21740v5, App. Q Table 10; github.com/yzhang511/bit @ f107ae9).
# Plan and BIT code references: docs/SSL_PLAN.md. Decisions (approved 2026-10-19): docs/DESIGN.md §7.
# Aim of the project: phoneme-free brain decoding. This corpus serves the T15 (Brain-to-Text '25) decoder, so it is
# restricted to speech-sentence recordings (attempted / imagined) and excludes every evaluation trial.
# `corpus` is consumed by scripts/build_ssl_corpus.py (src/bit_experiments/ssl_data.py).
# `pretrain` records the run we would launch later; nothing in this file starts training.
seed: 42

corpus:
  out_dir: data/processed/ssl_human
  bin_ms: 20                 # fixed (ssl_data.BIN_MS); 10 ms Kunz files are summed to 20 ms within each block
  feature: tx                # threshold crossings only, as BIT ("SBP is unavailable in some pretraining datasets");
                             # fine-tuning adds SBP, so the T15 read-in is re-initialized there and the core transfers
  min_bins: 75               # 1.5 s = masker.max_timespan (15 patches) x patch_size (5); shorter sequences dropped
  max_bins: 2500             # = embedder.max_F (RoPE positions are bin indices); longer trials cut into near-equal pieces
  stitch_by: dataset_subject # one read-in/read-out per (dataset, participant) ...
  stitch_merge:              # ... except where channel identity is verified: Kunz T15 and B2T'25 T15 share one
    kunz_T15: b2t25_T15      #     (duplicated trials match channel-for-channel). T12 Kunz vs B2T'24: unverified -> separate
  stitch_order: [b2t25_T15, b2t24_T12, kunz_T12, kunz_T16]   # 0/1 = BIT's own DATASET_TO_IDX order
  normalization:
    scope: block_then_day    # BIT's B2T'24 loader: z-score per block (own bins), then per day (train-split stats)
    stats_split: train
    min_sd: 0.01             # sd floor (feature units) for near-silent channels
    clip: 10                 # the B2T'25 release is clipped at exactly +/-10; same bound everywhere
    per_dataset:
      b2t25: {scope: none}   # used exactly as released (already rolling-z-scored and clipped); BIT does not re-normalize

  datasets:
    b2t25:                   # Brain-to-Text '25, T15 (Card et al. 2024, Dryad doi:10.5061/dryad.dncjsxm85)
      enabled: true
      subject: T15
      path:                  # first existing candidate is used; extracted dir (BIT layout) or the zip itself
        - data/raw/brandman_2024_text
        - data/t15_copyTask_neuralData.zip
      channels: [0, 256]     # input_features columns: TX 0:256 (SBP 256:512 unused). Already z-scored by the release
      splits:                # documentation: fixed in ssl_data.load_b2t25
        train: data_train    # all train trials
        val: data_val        # BIT split_val half (RandomState(42) permutation, first half); the other half = BIT "test"
      val_seed: 42           # data_test (no labels) and BIT's test half are never read as neural data
    b2t24:                   # Brain-to-Text '24, T12 (Willett et al. 2023, Dryad doi:10.5061/dryad.x69p8czpq)
      enabled: true
      subject: T12
      path:
        - data/raw/willett_2023_text
        - data/raw/willett_2023_text/competitionData.tar.gz
        - data/competitionData.tar.gz
      feature: tx1           # -3.5 x RMS threshold crossings (BIT default)
      channels: [0, 128]     # area 6v only (BIT area_start/area_end); area 44 dropped
      splits:                # documentation: fixed in ssl_data.load_b2t24
        train: train
        val: test            # the competition "test" folder = BIT "val"; its split_val half is our val
      val_seed: 42           # competitionHoldOut (no labels) is never read
    kunz:                    # Kunz et al. 2025 (Dryad doi:10.5061/dryad.gf1vhhn1j): speech-sentence files only
      enabled: true
      isolated: null           # excluded: Phase 1-3 evaluation data (7-word isolated behaviors)
      interleaved: null        # excluded: Phase 2 drift-control evaluation data
      sentences: data/raw/sentenceData.zip     # .mat members read straight from the zip
      archives: []             # deferred (non-speech tasks / extra engineering): conjunctiveCounting, chittychittybangbang
                               # (T12 256-ch incl. area 44), seqRecall* (no block info)
      skip_eval_files: true    # *_eval.mat = closed-loop evaluation sessions: held out for any later imagined-sentence
                               # decoding (also drops the one 33 ms-bin file)
      mode: blocks           # whole recorded blocks (incl. delay + ITI) in near-equal chunks; "trials" = [delay onset, go end)
      chunk_bins: 500        # 10 s chunks (<= 500 bins, >= 250 bins after the even split)
      # Blocks that are also B2T'25 trials (same participant/day/block): 2024.03.03 blocks 3/6/11/13 =
      # sentenceData t15.2024.03.03_attempted_50words (verified: same sentences, same go lengths). The builder also
      # re-derives this from ALL B2T'25 splits (train/val/test) whenever they are present.
      exclude_blocks:
        T15:
          "2024.03.03": [1, 3, 6, 11, 13]
          "2024.06.14": [1, 9, 11, 12]

pretrain:                    # planned run (Phase 4b, GPU host); values = BIT defaults unless marked
  bit_commit: f107ae988d782609b78d1d7488490cca9fb7a103
  features: tx1              # key into DATASET_CHANNELS, patched from bit_stitch_tables(manifest)
  model:                     # configs/models/encoder/ndt.yaml, unchanged (~7M core params)
    transformer: {hidden_size: 384, n_layers: 7, n_heads: 6, inter_size: 512, use_rope: true, rope_theta: 10000.0,
                  act: gelu, dropout: 0.4, fixup_init: true}
    embedder:
      patch_size: 5          # 5 x 20 ms = 100 ms tokens
      masker: {active: true, ratio: 0.5, expand_prob: 1.0, max_timespan: 15}
      max_F: 2500            # max bins per sequence (= corpus.max_bins)
      dropout: 0.2
    smooth_and_noise: {noise: true, smooth_sd: 2, white_noise_sd: 0.2, constant_offset_sd: 0.05}
    context: {forward: -1, backward: -1}
  method: {method_name: ssl, loss: mse}
  training: {num_epochs: 400, train_batch_size: 64, test_batch_size: 64, eval_every: 1, save_every: 50,
             mixed_precision: bf16, drop_last_train_dataloader: false}
  optimizer: {lr: 5.0e-4, wd: 1.0e-5, eps: 1.0e-8, scheduler: cosine, warmup_pct: 0.0, div_factor: 25,
              gradient_accumulation_steps: 1}   # schedule as in BIT's NDT configs (Table 10 gives lr/wd/batch/epochs)
  selection:
    val_groups: [b2t24_T12, b2t25_T15]   # T12 / T15 val halves (BIT-val); BIT-test and holdouts never read
    metric: r2_masked        # R^2 on masked, unpadded bins, pooled per group, then mean over groups (proposal; BIT's
                             # built-in metric is R^2 over all bins incl. unmasked ones, see SSL_PLAN.md)
    eval_mask_seed: 0        # fixed eval masks so epochs are comparable
  seeds: [42]
