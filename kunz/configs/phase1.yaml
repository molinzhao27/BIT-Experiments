# Phase 1: reproduce Kunz et al. 2025 Fig 1E (isolated-word decoding).
# Mirrors the official analysis/Fig1EF_7Behavior7WordDecoding.m; deviations are in docs/DATA_NOTES.md §6.
seed: 42
task: isolatedVerbalBehaviors

preprocess:
  smoothing_sigma_ms: 100   # official code: 5 bins x 20 ms (T12) / 10 bins x 10 ms; the paper text says 60 ms
  smoothing_truncate: 5     # gaussSmooth_fast wing = ceil(5 * sigma)

window:
  length_ms: 500
  step_ms: 100
  active_start_ms: -500     # active behaviors: starts from -500 ms ...
  active_end_after_go_ms: 1000   # ... to (go duration + 1000 ms) after go onset
  # passive behaviors (listening, reading): starts from -delay to 0 ms (stimulus epoch)

passive_behaviors: [listening, reading]

# [delay_s, go_s] per participant x behavior: official `t1Xbehavior Times`
behavior_times:
  T12: {default: [2.0, 3.0], listening: [1.5, 1.5], reading: [2.0, 1.5]}
  T15: {default: [1.5, 3.0], listening: [1.5, 0.5], reading: [1.5, 0.5]}
  T16: {default: [2.0, 3.0], attempted: [2.0, 4.0], listening: [1.5, 1.0], reading: [2.0, 1.0]}
  T17: {default: [1.5, 3.0], listening: [1.5, 0.5], reading: [1.5, 0.5]}

cv:
  outer_folds: 10
  inner_folds: 10

classifier: diag_lda        # official fitcdiscr 'diaglinear', uniform prior (pooled-variance Gaussian NB)
chance: 0.142857
ci_level: 0.95

behaviors:                   # Fig 1E column order
  attempted: Attempted
  mouthed: Mimed
  imagined1stMotor: Motoric Inner Speech
  imagined1stAuditory: Auditory Inner Speech
  imaginedListening: Imagined Listening
  listening: Listening
  reading: Silent Reading

# Fig 1E row order (participant, array name in data, label). Rows after the
# paper's nine were excluded from Fig 1E (not significant for any behavior).
arrays:
  - [T16, i6v, T16-i6v]
  - [T12, i6v, T12-i6v]
  - [T15, i6v, T15-i6v]
  - [T15, M1, T15-4]
  - [T17, s6v-v, T17-s6v-A]
  - [T17, s6v-d, T17-s6v-B]
  - [T12, s6v, T12-s6v]
  - [T15, s6v, T15-s6v]
  - [T15, 55b, T15-55b]
  - [T16, PEF, T16-PEF]
  - [T16, 6d, T16-6d]
  - [T17, 55b, T17-55b]
n_paper_rows: 9

# Paper numbers to sanity-check against: [participant, array, behavior, accuracy %]
paper_targets:
  - [T16, i6v, listening, 92.1]
  - [T12, i6v, imagined1stMotor, 72.6]
  - [T12, i6v, attempted, 97.9]

# Extra runs (same CV), reported next to the primary run
variants:
  gnb_sigma100: {classifier: gnb}                 # sklearn-style per-class-variance Gaussian NB
  diag_lda_sigma60: {smoothing_sigma_ms: 60}      # paper-text smoothing
