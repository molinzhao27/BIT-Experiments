[project]
name = "bit-experiments"
version = "0.1.0"
description = "Experiments on BIT (Brain-to-Text): SSL pretraining, phoneme-free alignment, and LLM swaps"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "h5py",
    "editdistance",
    "torch",
    "safetensors",
]

[project.optional-dependencies]
# Evaluator (BERTScore). Training runs in BIT's own environment (configs/bit_requirements.txt).
eval = ["bert-score"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
